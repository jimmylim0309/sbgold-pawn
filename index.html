<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>금담보 대출 관리 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">
  <div class="max-w-6xl mx-auto space-y-8">
    
    <!-- 헤더 -->
    <header class="flex justify-between items-center border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold text-amber-400">금담보 대출 관리 시스템</h1>
        <p class="text-sm text-slate-400">Gold Collateral Loan Management</p>
      </div>
      <div class="space-x-2">
        <button id="lang-ko-btn" onclick="switchLanguage('ko')" class="px-3 py-1 text-xs rounded bg-amber-500 text-slate-950 font-bold">한국어</button>
        <button id="lang-th-btn" onclick="switchLanguage('th')" class="px-3 py-1 text-xs rounded bg-slate-800 text-slate-300">ไทย</button>
      </div>
    </header>

    <!-- TAB 1: 관리자 대시보드 -->
    <section class="bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-6">
      <h2 class="text-xl font-bold text-slate-100 border-b border-slate-800 pb-3" id="txt-admin-title">관리자 - 대출 등록 및 현황</h2>
      
      <!-- 신규 대출 및 고객 등록 폼 -->
      <form id="add-customer-form" class="space-y-4 bg-slate-950 p-4 rounded-lg border border-slate-800/80">
        <h3 class="font-semibold text-amber-400 text-sm" id="txt-form-title">신규 대출 등록</h3>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div>
            <label class="block text-xs text-slate-400 mb-1" id="lbl-name">고객명</label>
            <input type="text" id="add-name" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-400">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1" id="lbl-phone">전화번호</label>
            <input type="text" id="add-phone" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-400">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1" id="lbl-pw">비밀번호</label>
            <input type="password" id="add-pw" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-400">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1" id="lbl-date">대출일자</label>
            <input type="date" id="add-date" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-400">
          </div>
        </div>

        <!-- 담보 물품 입력 영역 -->
        <div class="space-y-2 pt-2">
          <div class="flex justify-between items-center">
            <span class="text-xs font-semibold text-slate-300" id="lbl-items">담보 물품 목록</span>
            <button type="button" onclick="addGoldInputRow('add-gold-container')" class="text-xs bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded text-amber-400 border border-amber-400/30">+ 물품 추가</button>
          </div>
          <div id="add-gold-container" class="space-y-2"></div>
        </div>

        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded transition" id="btn-submit">대출 내역 등록하기</button>
      </form>

      <!-- 현황 테이블 -->
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-950 text-slate-400 text-xs uppercase border-b border-slate-800">
            <tr>
              <th class="py-3 px-4">고객명</th>
              <th class="py-3 px-4">전화번호</th>
              <th class="py-3 px-4" colspan="2">담보 물품 및 개별 대출일</th>
              <th class="py-3 px-4">총 원금</th>
              <th class="py-3 px-4 text-right">월 이자</th>
              <th class="py-3 px-4 text-center">관리</th>
            </tr>
          </thead>
          <tbody id="admin-table-body" class="divide-y divide-slate-800/50"></tbody>
        </table>
      </div>
    </section>

    <!-- TAB 2: 고객 대시보드 조회 -->
    <section class="bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-6">
      <h2 class="text-xl font-bold text-slate-100 border-b border-slate-800 pb-3" id="txt-cust-title">고객 전용 - 대출 조회</h2>
      
      <div class="flex flex-col sm:flex-row gap-4 max-w-xl">
        <input type="text" id="cust-login-phone" placeholder="전화번호 입력" class="bg-slate-950 border border-slate-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-400 flex-1">
        <input type="password" id="cust-login-pw" placeholder="비밀번호 입력" class="bg-slate-950 border border-slate-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-400 flex-1">
        <button onclick="handleCustomerLogin()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-6 py-2 rounded text-sm transition" id="btn-cust-login">조회하기</button>
      </div>

      <!-- 고객 대출 조회 결과 -->
      <div id="cust-result" class="hidden bg-slate-950 p-6 rounded-lg border border-amber-500/30 space-y-4">
        <div class="border-b border-slate-800 pb-3 flex justify-between items-center">
          <div>
            <h3 class="text-lg font-bold text-amber-400" id="cust-info-name">-</h3>
            <p class="text-xs text-slate-400" id="cust-info-phone">-</p>
          </div>
          <div class="text-right">
            <span class="text-xs text-slate-400 block">총 대출 원금</span>
            <span class="text-xl font-bold text-white" id="cust-info-total-amount">0 원</span>
          </div>
        </div>

        <div>
          <h4 class="text-xs font-semibold text-slate-400 mb-2">보유 담보물 및 개별 이자 납부 일정</h4>
          <div id="cust-gold-list" class="space-y-2"></div>
        </div>

        <div class="bg-slate-900 p-4 rounded border border-slate-800 flex justify-between items-center">
          <span class="text-sm font-semibold text-slate-300">월 총 이자 금액</span>
          <span class="text-lg font-bold text-amber-400" id="cust-info-total-interest">0 원</span>
        </div>
      </div>
    </section>
  </div>

  <script>
    // Supabase 설정
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentLang = 'ko';

    // 초기화
    document.addEventListener('DOMContentLoaded', () => {
      // 오늘 날짜 기본 세팅
      document.getElementById('add-date').value = new Date().toISOString().substring(0, 10);
      addGoldInputRow('add-gold-container');
      renderAdminDashboard();

      document.getElementById('add-customer-form').addEventListener('submit', handleAddCustomer);
    });

    // 다국어 언어 변경
    function switchLanguage(lang) {
      currentLang = lang;
      document.getElementById('lang-ko-btn').className = lang === 'ko' ? "px-3 py-1 text-xs rounded bg-amber-500 text-slate-950 font-bold" : "px-3 py-1 text-xs rounded bg-slate-800 text-slate-300";
      document.getElementById('lang-th-btn').className = lang === 'th' ? "px-3 py-1 text-xs rounded bg-amber-500 text-slate-950 font-bold" : "px-3 py-1 text-xs rounded bg-slate-800 text-slate-300";
    }

    // 담보 입력 행 추가
    function addGoldInputRow(containerId) {
      const container = document.getElementById(containerId);
      const row = document.createElement('div');
      row.className = "gold-input-row grid grid-cols-12 gap-2 items-center bg-slate-900 p-2 rounded border border-slate-800";
      row.innerHTML = `
        <input type="text" placeholder="종류 (예: 목걸이)" class="item-type col-span-3 bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs">
        <input type="text" placeholder="중량 (예: 15.2g)" class="item-weight col-span-3 bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs">
        <input type="number" placeholder="대출금액(원)" class="item-amount col-span-3 bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs">
        <input type="number" step="0.1" value="2.0" placeholder="이율(%)" class="item-rate col-span-2 bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-amber-400 font-bold">
        <button type="button" onclick="this.parentElement.remove()" class="col-span-1 text-red-400 hover:text-red-300 text-xs text-center font-bold">✕</button>
      `;
      container.appendChild(row);
    }

    // 담보 물품 데이터 수집
    function getGoldItemsData(containerId) {
      const rows = document.querySelectorAll(`#${containerId} .gold-input-row`);
      const items = [];
      rows.forEach(r => {
        const type = r.querySelector('.item-type').value.trim();
        const weight = r.querySelector('.item-weight').value.trim();
        const amount = parseFloat(r.querySelector('.item-amount').value) || 0;
        const rate = parseFloat(r.querySelector('.item-rate').value) || 0;
        if (type && amount > 0) {
          items.push({ item_type: type, weight, amount, rate });
        }
      });
      return items;
    }

    // 날짜 및 이자 계산 헬퍼
    function getNextDueDate(dateStr) {
      if (!dateStr || dateStr === '-') return new Date();
      const d = new Date(dateStr);
      const today = new Date();
      while (d <= today) {
        d.setMonth(d.getMonth() + 1);
      }
      return d;
    }

    function calculateTotalInterest(items) {
      if (!items || items.length === 0) return 0;
      return items.reduce((sum, i) => sum + (Number(i.amount) * (Number(i.rate) / 100)), 0);
    }

    function formatCurrency(val) {
      return Math.round(val).toLocaleString('ko-KR');
    }

    function formatDate(d) {
      if (!d || isNaN(new Date(d))) return '-';
      const dateObj = new Date(d);
      return dateObj.toISOString().substring(0, 10);
    }

    // 1. 고객 및 담보 물품 추가 (개별 loan_date 적용)
    async function handleAddCustomer(e) {
      e.preventDefault();
      const name = document.getElementById('add-name').value.trim();
      const phone = document.getElementById('add-phone').value.trim();
      const pw = document.getElementById('add-pw').value.trim();
      const loan_date = document.getElementById('add-date').value;
      const items = getGoldItemsData('add-gold-container');

      if (items.length === 0) {
        alert(currentLang === 'ko' ? "최소 1개 이상의 금 정보를 올바르게 입력해주세요." : "กรุณากรอกข้อมูลทองคำอย่างน้อย 1 รายการ");
        return;
      }

      // 고객 존재 여부 확인
      let { data: existingCust, error: findError } = await supabaseClient
        .from('customers')
        .select('id')
        .eq('phone', phone)
        .maybeSingle();

      if (findError) {
        alert("고객 조회 오류: " + findError.message);
        return;
      }

      let customerId;

      if (existingCust) {
        customerId = existingCust.id;
        // 기존 고객인 경우 프로필(이름, 비밀번호)만 업데이트
        const { error: updateError } = await supabaseClient
          .from('customers')
          .update({ name, pw })
          .eq('id', customerId);

        if (updateError) {
          alert("고객 정보 갱신 실패: " + updateError.message);
          return;
        }
      } else {
        // 신규 고객 생성
        const { data: custData, error: custError } = await supabaseClient
          .from('customers')
          .insert([{ name, phone, pw }])
          .select()
          .single();

        if (custError) {
          alert("고객 생성 실패: " + custError.message);
          return;
        }
        customerId = custData.id;
      }

      // 담보 물품 등록 시 각각의 대출 날짜(loan_date)를 함께 저장
      const goldPayload = items.map(item => ({
        customer_id: customerId,
        item_type: item.item_type,
        weight: item.weight,
        amount: item.amount,
        rate: item.rate,
        loan_date: loan_date
      }));

      const { error: goldError } = await supabaseClient
        .from('gold_items')
        .insert(goldPayload);

      if (goldError) {
        alert("담보 물품 등록 실패: " + goldError.message);
        return;
      }

      alert(currentLang === 'ko' ? "대출 건이 성공적으로 추가되었습니다." : "บันทึกข้อมูลเรียบร้อยแล้ว");

      e.target.reset();
      document.getElementById('add-date').value = new Date().toISOString().substring(0, 10);
      document.getElementById('add-gold-container').innerHTML = "";
      addGoldInputRow('add-gold-container');
      renderAdminDashboard();
    }

    // 2. 관리자 대시보드 렌더링
    async function renderAdminDashboard() {
      const tbody = document.getElementById('admin-table-body');
      tbody.innerHTML = '<tr><td colspan="7" class="py-4 text-center text-slate-500">로딩 중...</td></tr>';

      const { data: customers, error } = await supabaseClient
        .from('customers')
        .select(`
          id,
          name,
          phone,
          gold_items ( id, item_type, weight, amount, rate, loan_date )
        `);

      if (error) {
        tbody.innerHTML = `<tr><td colspan="7" class="py-4 text-center text-red-400">데이터 로드 오류: ${error.message}</td></tr>`;
        return;
      }

      if (!customers || customers.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="py-4 text-center text-slate-500">등록된 대출 내역이 없습니다.</td></tr>';
        return;
      }

      tbody.innerHTML = '';

      customers.forEach(c => {
        const items = c.gold_items || [];
        if (items.length === 0) return;

        const custPrincipal = items.reduce((sum, item) => sum + Number(item.amount), 0);
        const interest = calculateTotalInterest(items);

        // 개별 담보물건별 대출일 및 이자 납부일 표시
        const goldDetails = items.map(item => {
          const itemLoanDate = item.loan_date || '-';
          const nextDue = getNextDueDate(itemLoanDate);
          return `• <span class="text-amber-300 font-medium">${item.item_type}</span> (${item.weight || '규격미지정'}, ${item.rate}%): ${formatCurrency(item.amount)}원 | 대출일: ${itemLoanDate} <span class="text-amber-400/90">(다음 납부일: ${formatDate(nextDue)})</span>`;
        }).join('<br>');

        const row = document.createElement('tr');
        row.className = "hover:bg-slate-900/50 border-b border-slate-800";
        row.innerHTML = `
          <td class="py-3 px-4 font-semibold text-amber-400 align-top">${c.name}</td>
          <td class="py-3 px-4 align-top">${c.phone}</td>
          <td class="py-3 px-4 align-top text-xs text-slate-300" colspan="2">
            ${goldDetails}
          </td>
          <td class="py-3 px-4 align-top">
            <div class="font-bold text-white mb-1">${formatCurrency(custPrincipal)} 원</div>
          </td>
          <td class="py-3 px-4 text-right font-bold text-amber-400 align-top">${formatCurrency(interest)} 원</td>
          <td class="py-3 px-4 text-center align-top">
            <button onclick="deleteCustomer('${c.id}')" class="text-xs text-red-400 hover:text-red-300 border border-red-500/30 px-2 py-1 rounded">고객삭제</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    // 고객 정보 삭제
    async function deleteCustomer(customerId) {
      if (!confirm("해당 고객과 연관된 모든 담보 물품 데이터가 함께 삭제됩니다. 진행하시겠습니까?")) return;

      await supabaseClient.from('gold_items').delete().eq('customer_id', customerId);
      const { error } = await supabaseClient.from('customers').delete().eq('id', customerId);

      if (error) {
        alert("삭제 실패: " + error.message);
      } else {
        alert("삭제되었습니다.");
        renderAdminDashboard();
      }
    }

    // 3. 고객 전용 대출 조회
    async function handleCustomerLogin() {
      const phone = document.getElementById('cust-login-phone').value.trim();
      const pw = document.getElementById('cust-login-pw').value.trim();

      if (!phone || !pw) {
        alert("전화번호와 비밀번호를 모두 입력해주세요.");
        return;
      }

      const { data: customer, error } = await supabaseClient
        .from('customers')
        .select(`
          id,
          name,
          phone,
          pw,
          gold_items ( id, item_type, weight, amount, rate, loan_date )
        `)
        .eq('phone', phone)
        .eq('pw', pw)
        .maybeSingle();

      if (error || !customer) {
        alert("일치하는 회원 정보가 없습니다. 전화번호와 비밀번호를 확인해주세요.");
        return;
      }

      const resultBox = document.getElementById('cust-result');
      resultBox.classList.remove('hidden');

      document.getElementById('cust-info-name').innerText = customer.name;
      document.getElementById('cust-info-phone').innerText = customer.phone;

      const items = customer.gold_items || [];
      const totalAmount = items.reduce((sum, item) => sum + Number(item.amount), 0);
      const totalInterest = calculateTotalInterest(items);

      document.getElementById('cust-info-total-amount').innerText = formatCurrency(totalAmount) + " 원";
      document.getElementById('cust-info-total-interest').innerText = formatCurrency(totalInterest) + " 원";

      const goldListContainer = document.getElementById('cust-gold-list');
      goldListContainer.innerHTML = items.map((item, idx) => {
        const itemLoanDate = item.loan_date || '-';
        const itemNextDue = formatDate(getNextDueDate(itemLoanDate));
        return `
          <div class="flex justify-between items-center py-2 border-b border-slate-800/50 text-sm">
            <div>
              <span class="font-medium text-slate-200">${idx + 1}. ${item.item_type} (${item.weight || '규격미지정'})</span>
              <span class="text-xs text-amber-400/80 block mt-0.5">대출일: ${itemLoanDate} | 다음 이자 납부일: ${itemNextDue}</span>
            </div>
            <div class="text-right">
              <span class="font-semibold text-amber-400 block">${formatCurrency(item.amount)} 원</span>
              <span class="text-xs text-slate-400">월 이자: ${formatCurrency(item.amount * (item.rate / 100))} 원</span>
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
